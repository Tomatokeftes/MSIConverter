name: Tests

on:
  # Kept narrow on purpose -- only main, never every push to every feature
  # branch, whose PRs the trigger below already covers. Without this, NOTHING
  # ran the suite against main, and releases publish to PyPI from main's tip, so
  # v3.0.0 shipped from a commit no test job had ever seen.
  #
  # This trigger is load-bearing for releases and must not be narrowed further.
  # release.yml gates on a completed run of THIS workflow for the exact commit
  # it is about to release, and it fails closed: drop this trigger and every
  # release blocks for 30 minutes and then errors, rather than shipping
  # ungated. Releases no longer run on push, so this is the only thing that
  # gives main's tip a test run to be gated on.
  push:
    branches: [ main ]
  # Deliberately unfiltered. `branches:` on a pull_request trigger matches the
  # BASE branch, not the head, so `branches: [ main ]` skipped every stacked PR
  # (one feature branch based on another) until its parent merged and GitHub
  # retargeted it onto main -- i.e. the tests only ran after review, never
  # before. This cannot double up with the `push:` above, because a commit
  # pushed to main is never also the head of an open pull request.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # v9 flipped prune-cache's default to false, which keeps built wheels
        # and sources in the cache entry and changes the cache key. Pin the
        # lean pre-v9 behaviour explicitly.
        prune-cache: true
    - name: Install dependencies
      # --locked fails instead of silently re-resolving if uv.lock has
      # drifted from pyproject.toml. Only the test group: pytest does not
      # need Jupyter, matplotlib or the docs stack that `dev`/`docs` carry.
      run: uv sync --locked --no-default-groups --group test
    - name: Test with pytest
      run: |
        uv run pytest -m "not integration" --disable-warnings --cov=thyra --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        # v5 renamed `file` to `files`. The old name is not an alias: it is
        # simply unrecognised, so the upload silently covers nothing.
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # The integration lane, which `addopts` in pyproject.toml deselects from every
  # default `pytest` run. It is its own job rather than one more step in `test`
  # so that it appears as a separately named check: the lane sat with 15 of its
  # 18 tests failing precisely because no job anywhere ran it, and a step buried
  # in another job would be just as easy to lose again.
  #
  # Most of these cover the streaming/CSC converter, which writes the Zarr store
  # a downstream consumer opens with anndata.experimental.read_lazy(), so both
  # operating systems are worth the runner time -- the atomic-write and path
  # behaviour under test differs between them.
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # See the test job: pin the lean pre-v9 pruning behaviour.
        prune-cache: true
    - name: Install dependencies
      run: uv sync --locked --no-default-groups --group test
    - name: Test with pytest
      # `-m integration` on the command line overrides the `-m "not integration"`
      # that addopts supplies, so this is exactly the invocation documented in
      # tests/README.md -- which keeps that documentation honest.
      run: |
        uv run pytest -m integration --disable-warnings

  # Installs thyra the way an end user does: a plain `pip install .` that
  # resolves dependencies fresh from PyPI, WITHOUT uv.lock. This is the
  # only job that exercises the pip resolver against the version bounds in
  # pyproject.toml, so it catches mismatched dependency sets (e.g. a stale
  # spatialdata paired with too-new ome-zarr/dask) that the lockfile hides.
  # Deliberately NOT switched to uv with the rest of this file: pip is what
  # an end user's `pip install thyra` runs, so pip's resolver is the thing
  # under test here.
  clean-venv-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install thyra from a clean venv (no lockfile)
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Report the resolved dependency set
      run: pip list
    - name: Verify the installed console script actually runs
      # Deliberately placed BEFORE the test-only installs, so this runs
      # against exactly the closure pyproject.toml declares and nothing
      # else: a dependency supplied only by pytest/mock cannot mask a
      # missing declaration here.
      #
      # `pip install .` can succeed while the shipped entry point is
      # unusable. `click` was imported at module scope by thyra/__main__.py
      # and declared nowhere in pyproject.toml, surviving only because dask
      # happens to require it; the day that stopped being true, this job
      # would have gone green and `thyra --help` would have raised
      # ImportError for the user. Executing the console script is what
      # closes that gap -- importing the package is not enough, because
      # the entry point in [project.scripts] is itself untested code.
      #
      # Run from outside the checkout so this exercises the INSTALLED
      # distribution and cannot silently fall back to the repo's ./thyra.
      run: |
        cd /tmp
        thyra --version
        thyra --help
    - name: Install the test-only dependencies
      run: pip install pytest pytest-cov mock
    - name: Verify save / read-back round-trip on the resolved set
      # thyra + its dependencies come from the non-editable pip install
      # above; PYTHONPATH only puts the repo root on sys.path so the
      # in-repo test helpers (the `tests` namespace package, which has no
      # __init__.py) import. Editable installs get this for free via a
      # .pth file, so the lockfile job never needs it.
      run: PYTHONPATH=. pytest -m "not integration" --disable-warnings
