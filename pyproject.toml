[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thyra"
version = "3.23.2"
description = "A modern Python library for converting Mass Spectrometry Imaging (MSI) data into SpatialData/Zarr format - your portal to spatial omics"
authors = [{ name = "Theodoros Visvikis", email = "t.visvikis@maastrichtuniversity.nl" }]
maintainers = [{ name = "Theodoros Visvikis", email = "t.visvikis@maastrichtuniversity.nl" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12, <3.14"
keywords = [
    "mass-spectrometry",
    "imaging",
    "spatialdata",
    "zarr",
    "omics",
    "bioinformatics",
    "msi",
    "imzml",
    "bruker",
    "spatial-omics",
    "data-conversion",
    "scientific-computing",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: File Formats",
    "Typing :: Typed",
    "Environment :: Console",
]

dependencies = [
    # The spatialdata / ome-zarr / zarr / dask cluster is tightly coupled and
    # all four release frequently with breaking cross-version interactions.
    # Floors alone are NOT enough for `pip install thyra`: without upper
    # bounds pip resolves a mismatched set (a stale spatialdata alongside a
    # much newer ome-zarr and dask), which fails to save/read back a
    # SpatialData object. The upper bounds below pin this cluster to
    # the tested, lockfile-consistent set so a plain pip install lands on a
    # working combination. The clean-venv CI job in .github/workflows/tests.yml
    # exercises exactly this pip-resolved path so these bounds stay honest.
    # Bump the ceilings deliberately after re-testing against newer releases.
    "dask>=2026.3.0, <2026.8",        # tested 2026.7.1 (spatialdata 0.8.0 needs >=2026.3.0)
    # The CLI is built on click -- `thyra/__main__.py` imports it at module scope,
    # so the `thyra` console script cannot start without it. It went undeclared
    # for the project's whole history before this line, and resolved only by
    # accident: dask requires click >=8.1, so every resolution to date happened
    # to supply one. That is luck, not a guarantee. If
    # dask ever drops or vendors click, `pip install thyra` yields an install
    # whose entry point dies with `ImportError: No module named 'click'` on the
    # first run, at __main__.py's import line, before any command executes.
    # The floor matches dask's own and the version the lockfile resolves. The
    # ceiling is `<9` because GroupedCommand subclasses click.Command and
    # overrides format_help(): a major release is free to change that. Verified
    # --help (including the grouped sections), --version and the Choice/IntRange
    # validators render identically on 8.1.8 (the lockfile, held there by
    # python-semantic-release's dev-only `<8.2` cap) and on 8.4.2, which is what
    # a plain `pip install thyra` resolves today and the lockfile never exercises.
    "click>=8.1, <9",                 # tested 8.1.8 and 8.4.2
    "defusedxml>=0.7.1",  # Secure XML parsing for the Bruker Rapiflex reader
    "geopandas>=0.9.0",
    # No `lxml` here, deliberately, and it is the inverse of the `click` case
    # above rather than an oversight. Nothing under `thyra/` imports it at any
    # depth, and the one dependency that could -- pyimzML -- imports it inside
    # `choose_iterparse()` and only when the caller asks for `parse_lib="lxml"`.
    # Thyra's single ImzMLParser call site passes `parse_lib="ElementTree"` on
    # purpose (`readers/imzml/imzml_reader.py`, pinned by a test): the
    # unmaintained upstream prunes each <spectrum> out of the tree under lxml
    # and misreports the resulting `ERR_NO_MEMORY` as an `xmlSAX2Characters`
    # failure. pyimzML does not declare lxml either -- its Requires-Dist is
    # `numpy, wheezy.template` on both 1.4.0 (the floor) and 1.5.5 -- so Thyra
    # was not covering for a missing upstream declaration; the import is
    # guarded by ImportError on 1.4.0 and gone from the default path on 1.5.5.
    # Every other requirer in the resolved set asks for it behind an extra
    # Thyra does not request (pandas[xml], tifffile[xml], fonttools[lxml], ...),
    # so this line was the only unconditional one and removing it drops lxml
    # from the closure.
    "numpy>=2.0.0, <3",
    # pandas 3.0 makes `future.infer_string` the default, which gives the table
    # indices and string columns pandas' `str` dtype. anndata >= 0.13 serializes
    # that natively (anndata #2133); older anndata could not, which is why this
    # project carried a write-time coercion until the anndata floor moved. The
    # ceiling is NOT `<3`: capping there would strand users whose other packages
    # want pandas 3. `<4` records the newest major actually exercised -- the unit
    # suite passes on 2.3.2 (the lockfile) and on 3.0.5 with this set.
    "pandas>=2.0.0, <4",              # tested 2.3.2 and 3.0.5
    "pyimzML>=1.4.0",
    "scipy>=1.7.0",
    "Shapely>=2.0.0",
    "spatialdata>=0.8.0, <0.9",       # tested 0.8.0
    # Floor pulls the fix for the zarr_format/Group.create_array() bug that
    # bit ome_zarr 0.12.x with newer dask, and spatialdata 0.8 requires >= 0.16.
    "ome-zarr>=0.16.0, <0.19",        # tested 0.18.0
    "tqdm>=4.50.0",
    # Floor is 3.1.6, and it is load-bearing. anndata >= 0.13 writes every zarr v3
    # array with `shards="auto"`, and `_auto_partition` sized the auto INNER chunk
    # with `max_bytes=1024` where the line right above it says "aim for a 1MiB
    # chunk". zarr-python#3603 changed that 1024 to 1048576; it merged six days
    # AFTER 3.1.5 shipped, so 3.1.4 and 3.1.5 both still carry the defect
    # (`chunk_grids.py:267` in each) and 3.1.6 is the first release without it.
    # Do not drop the floor to 3.1.4 on the grounds that 3.1.4 is where
    # `array.target_shard_size_bytes` arrives -- the knob _chunking.table_write_config
    # sets to claim the budget from anndata. That knob is necessary, not sufficient.
    #
    # Both halves of the damage, measured on X/data of test_data/pea.imzML (60.1M
    # nnz, f8, 481 MB):
    #   - Below 3.1.4 the knob does not exist, so a shard is 2 auto chunks -- ~1.8 KB,
    #     and a shard is one FILE. 393,310 files for a single table, and 434 s of a
    #     445 s conversion spent in the write, against 12 files and 2.7 s on 3.1.6.
    #     Nothing in Thyra changed; the anndata 0.13 bump alone did this.
    #   - On 3.1.4/3.1.5 the 128 MiB budget IS honoured, so the file count stays sane
    #     (4), but the chunk inside those files is 920 B: ~145,900 separately
    #     compressed chunks per shard against 142 on 3.1.6, plus the shard index that
    #     implies. A 3.1.5 resolve buys that silently, and the shard-level assertion
    #     cannot see it; _chunking.MIN_TABLE_CHUNK_BYTES is what catches it.
    "zarr>=3.1.6, <3.2",              # tested 3.1.6
    "imagecodecs>=2024.1.1",  # For reading compressed TIFF optical images
    # Floor is 0.13.2, not 0.13.0. anndata 0.13.0 imports
    # `typing_extensions.sentinel` (needs typing-extensions >= 4.16) but declares
    # no floor for it, so a resolver prefers 0.13.0, pairs it with an older
    # typing-extensions, and produces an environment that installs cleanly and
    # then dies at import. 0.13.2 declares the floor correctly.
    #
    # 0.13 is also the release that made the pandas 3 string-dtype coercion in
    # base_spatialdata_converter.py unnecessary (anndata #2221, fixed by #2133);
    # that coercion was deleted when this floor moved. See issue #117.
    "anndata>=0.13.2, <0.14",         # tested 0.13.2
    "psutil>=5.0.0",
    # The MSI metadata schema (thyra/metadata/schema) is written against the
    # pydantic v2 validation API, and the committed JSON Schema artifact is
    # generated from the models (a unit test keeps the two in sync). pydantic
    # already arrives transitively -- ome-zarr-models in the spatialdata stack
    # requires >=2.11.5 -- so like click above this restates a direct import
    # as a direct dependency rather than changing the resolved set. Floor 2.7
    # is the oldest line the code is plausibly compatible with; the lockfile
    # resolves 2.12.x and the JSON-sync test pins the emission against it.
    "pydantic>=2.7, <3",              # tested 2.12.5
    # Imported directly, not merely re-exported through spatialdata: tifffile by
    # converters/spatialdata/optical_image.py, xarray by that module and the
    # base, 2D, 3D and streaming converters. Both arrive transitively today
    # (spatialdata requires xarray >=2024.10.0 outright; tifffile comes in behind
    # scikit-image and dask-image), so this is the same undeclared-direct-import
    # defect as click above -- but a quieter one. Their imports sit inside the
    # SPATIALDATA_AVAILABLE try/except, so losing either degrades instead of
    # crashing: every converter is replaced by a dummy and the run reports
    # "SpatialData dependencies not available" rather than naming the real cause.
    # Floors only, and deliberately so; no upper bound nothing here has tested.
    # The tifffile floor is load-bearing: optical_image.py streams TIFF row bands
    # through tifffile's zarr adapter (``TiffPage.aszarr()``), which speaks zarr
    # format 3 only from 2026.5.2 on; an older tifffile hands zarr 3 a store it
    # cannot open and every optical image would be dropped. tifffile's own
    # metadata asks for zarr >= 3.2 there, but the adapter works on the 3.1.6
    # this project pins (exercised by tests/unit/converters/
    # test_optical_image_streaming.py and on real FlexImaging exports).
    "tifffile>=2026.5.2",             # tested 2026.8.23
    "xarray>=2024.10.0",
]

[project.urls]
Homepage = "https://github.com/M4i-Imaging-Mass-Spectrometry/thyra"
Repository = "https://github.com/M4i-Imaging-Mass-Spectrometry/thyra"
Documentation = "https://M4i-Imaging-Mass-Spectrometry.github.io/thyra/"
"Bug Tracker" = "https://github.com/M4i-Imaging-Mass-Spectrometry/thyra/issues"
Discussions = "https://github.com/M4i-Imaging-Mass-Spectrometry/thyra/discussions"
Changelog = "https://github.com/M4i-Imaging-Mass-Spectrometry/thyra/blob/main/CHANGELOG.md"
# There is no CONTRIBUTING.md at the repository root; the guide lives at
# docs/contributing.md and is published as this page.
Contributing = "https://M4i-Imaging-Mass-Spectrometry.github.io/thyra/contributing/"

[project.scripts]
# cli() dispatches `thyra validate` / `thyra export-metaspace` by first
# argument and falls through to the positional conversion command, so
# `thyra INPUT OUTPUT` keeps working unchanged.
thyra = "thyra.__main__:cli"
thyra-check-ontology = "thyra.tools.check_ontology:main"
thyra-example-data = "thyra.tools.make_example_data:main"

# Explicit rather than relying on hatchling's name-based auto-detection, and
# the sdist is pinned to what poetry-core used to ship: the package, the docs
# it renders into the wheel-adjacent metadata, and nothing else -- hatchling's
# default sdist would otherwise sweep in tests/, docs/ and the CI scripts.
[tool.hatch.build.targets.wheel]
packages = ["thyra"]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor to the project root: hatchling patterns are
# git-style, so a bare "README.md" would also sweep in every nested README
# (handouts/, tests/). hatchling adds pyproject.toml and .gitignore itself.
include = [
    "/thyra",
    "/README.md",
    "/LICENSE",
]

# PEP 735 dependency groups, managed by uv. `uv sync` installs the project
# plus the `dev` group by default; CI test jobs install only `test` via
# `uv sync --no-default-groups --group test` so pytest never drags in
# Jupyter, matplotlib or the docs stack.
[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mock>=4.0.0",
]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pydocstyle>=6.3.0",
    # Its `click <8.2` cap is what holds the lockfile's click at 8.1.8; the
    # published bound in [project] is `<9` and is tested beyond that cap --
    # see the click comment above.
    "python-semantic-release",
    "python-dotenv>=1.1.1,<2",
    "pre-commit>=3.0.0",
    "bandit[toml]>=1.7.0",
    "types-requests>=2.25.0",
    "types-PyYAML>=6.0.0",
    "matplotlib>=3.7.0",
    "ipykernel>=6.30.1,<7",
    "jupyter>=1.1.1,<2",
    "docformatter>=1.7.7,<2",
    "ptitprince>=0.3.1,<0.4",
]
docs = [
    "mkdocs>=1.6, <2",
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.25, <1",       # renders docs/*.ipynb as site pages
    "mkdocstrings[python]>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (may be slow, may require external dependencies)"
]
addopts = "-v --tb=short -m \"not integration\""
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*:",
    "ignore::UserWarning:spatialdata.models.models:1053"
]

# =============================================================
# === SEMANTIC RELEASE CONFIGURATION                         ===
# =============================================================
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "thyra/__init__.py:__version__",
]
# `uv lock` runs here rather than as a workflow step because the build
# command is the only hook that executes AFTER semantic-release stamps the
# new version into pyproject.toml and BEFORE it makes the release commit.
# Without it, the lockfile's own `[[package]] name = "thyra"` entry keeps
# the previous version. The release commit lands on main without a test run
# (a GITHUB_TOKEN push starts no workflows), so nothing notices until the
# first branch cut after the release fails every CI job at
# `uv sync --locked` with "The lockfile at `uv.lock` needs to be updated" --
# see the one-off repair on PR #177 after v3.5.0. Regenerating the lockfile
# is only half the fix: `assets` below is what carries it into the release
# commit. uv reaches this command's PATH via the same SHA-pinned setup-uv
# step the test workflow uses (see release.yml).
build_command = "uv lock && pip install build && python -m build"
# Extra files to include in the release commit beyond the version-stamped
# ones above.
assets = ["uv.lock"]
upload_to_vcs_release = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "chore*",
    "ci*",
]

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote_settings]
name = "origin"
token = { env = "GITHUB_TOKEN" }

# =============================================================
# === CODE QUALITY TOOL CONFIGURATIONS                     ===
# =============================================================

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601", "B603", "B607"]  # Allow assert statements, shell usage, and subprocess calls with controlled input

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once types are added
disallow_incomplete_defs = false  # Set to true once types are added
check_untyped_defs = true
disallow_untyped_decorators = false  # Set to true once types are added
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pyimzml.*",
    "spatialdata.*",
    "anndata.*",
    "zarr.*",
    "dask.*",
    "geopandas.*",
    "shapely.*",
    "tqdm.*",
    "pandas.*",
    "psutil.*",
    "defusedxml.*",
]
ignore_missing_imports = true


[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D104", "D105"]  # Missing docstrings in modules, packages, and magic methods
